display_information:
  name: Agent Bridge
  description: Message and manage your existing local AI agents.
features:
  bot_user:
    display_name: Agent Bridge
    always_online: false
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  slash_commands:
    - command: /agents
      description: List, add, edit, pause, resume, or remove agents
      usage_hint: "[list|add|edit|pause|resume|remove] [agent]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
